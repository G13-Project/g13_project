<!DOCTYPE html>
<html>
<head>
    <title>Edit Company Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>

<div class="navbar">
    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img">
        Itiji
    </div>

    <div class="nav-right">
        <span class="user">{{ user }}</span>        

        <a href="/company/dashboard">Home</a>
        <a href="/company/cars">Cars</a>
        <a href="/company/drivers">Drivers</a>
        <a href="/company/statistics">Statistics</a>
        <a href="/company/profile">Profile</a>
        <a href="/logoff">Logout</a>
    </div>
</div>

<div class="bg">
    <div class="box profile-page" style="position: relative;">

        <h1 style="margin-bottom: 20px;">Edit Profile</h1>

        <!-- ✅ BOTÃO BACK -->
        <a href="{{ url_for('company_profile') }}"
           style="
                position:absolute;
                right:30px;
                top:30px;
                background:#00ff88;
                padding:8px 15px;
                border-radius:8px;
                text-decoration:none;
                color:black;
                font-weight:bold;
           ">
            Back
        </a>

        <form method="POST" enctype="multipart/form-data">

            <div class="section-rect">
                <h2 style="margin-bottom: 20px;">Profile Photo</h2>

                <div class="photo-upload-area">
                    <div class="photo-preview-wrapper">
                        {% if company.photo %}
                            <img src="{{ company.photo }}" class="photo-preview" id="photoPreview">
                        {% elif company.name and company.name|length > 0 %}
                            <img src="{{ url_for('static', filename='images/company/' ~ (company.name[0]|upper) ~ '.png') }}" class="photo-preview" id="photoPreview">
                        {% else %}
                            <div class="no-photo photo-preview" id="photoPreview">?</div>
                        {% endif %}
                    </div>

                    <div class="photo-upload-controls">
                        <label for="photoInput" class="btn btn-upload">📷 Choose Photo</label>
                        <input type="file" id="photoInput" name="photo" accept="image/*" style="display:none"
                            onchange="previewPhoto(this)">
                        
                        <button type="button" class="btn btn-remove-photo" id="removePhotoBtn" 
                                onclick="removePhoto()" {% if not company.photo %}style="display:none;"{% endif %}>
                            🗑️ Remove Photo
                        </button>
                        
                        <p class="photo-hint">JPG, PNG or WEBP. Max 5MB.</p>
                        <input type="hidden" name="remove_photo" id="removePhotoInput" value="false">
                    </div>
                </div>
            </div>

            <div class="section-rect">
                <h2 style="margin-bottom: 20px;">Company Information</h2>

                <label>Name:</label>
                <input type="text" name="name" value="{{ company.name }}" required>

                <label>Begin Date:</label>
                <input type="date" name="begin_date" value="{{ company.begin_date.split('/')|reverse|join('-') }}" required>
            </div>

            <div class="edit-actions">
                <button type="submit" class="btn btn-save">Save Changes</button>
            </div>

        </form>

    </div>
</div>

<script>
// Obter a imagem de fallback em Javascript
const userInitialFallback = "{{ url_for('static', filename='images/company/' ~ (company.name[0]|upper) ~ '.png') if company.name and company.name|length > 0 else '' }}";
</script>
<script src="{{ url_for('static', filename='js/company_edit.js') }}"></script>

</body>
</html>
