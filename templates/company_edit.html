<!DOCTYPE html>
<html>
<head>
    <title>Edit Company Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>

<!-- ✅ NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img">
        Itiji
    </div>

    <div class="nav-right">
        <span class="user">{{ user }}</span>

        <a href="/company/dashboard">Home</a>
        <a href="/company/cars">Cars</a>
        <a href="/company/drivers">Drivers</a>
        <a href="/company/statistics">Statistics</a>
        <a href="/company/profile">Profile</a>
        <a href="/logoff">Logout</a>
    </div>
</div>


<!-- ✅ FORM -->
<div class="home" style="min-height:100vh;">
    <div class="overlay"></div>

    <div class="home-content">

        <div class="ride-box"
             style="margin-top:30px; width:600px; margin:auto; position:relative;">

            <!-- ✅ TÍTULO -->
            <h2 style="margin-bottom:20px;">Edit Profile</h2>

            <!-- ✅ BOTÃO BACK -->
            <a href="/company/profile"
               style="
                    position:absolute;
                    right:30px;
                    top:30px;
                    background:#00ff88;
                    padding:8px 15px;
                    border-radius:8px;
                    text-decoration:none;
                    color:black;
               ">
                Back
            </a>

            <!-- ✅ FORM -->
            <form method="POST" enctype="multipart/form-data">

                <!-- NAME -->
                <label>Name:</label>
                <input type="text" name="name"
                       value="{{ company.name }}"
                       style="width:100%; margin-bottom:15px; padding:10px; border-radius:8px; border:none;">

                <!-- DATE (COM CALENDÁRIO) -->
                <label>Begin Date:</label>
                <input type="date" name="begin_date"
                       value="{{ company.begin_date.split('/')|reverse|join('-') }}"
                       style="width:100%; margin-bottom:15px; padding:10px; border-radius:8px; border:none;">

                

                <!-- BOTÃO -->
                <button type="submit"
                        style="
                            width:100%;
                            background:#00ff88;
                            padding:12px;
                            border:none;
                            border-radius:8px;
                            cursor:pointer;
                            font-weight:bold;
                        ">
                    Save Changes
                </button>

            </form>

        </div>

    </div>
</div>

</body>
</html>
