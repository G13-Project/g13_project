{% extends 'base.html' %}

{% block content %}

<div class="home">
    <div class="overlay"></div>

    <div class="home-content">
        <h1>Available Rides 🎯</h1>
        <p>Manage your rides</p>

        <!-- ========== SECÇÃO: VIAGEM RECOMENDADA ========== -->
        <div id="recommended-section" class="ride-section" style="display:none;">
            <h2>🌟 Recommended Ride</h2>
            <div class="ride-card recommended-ride" id="recommended-ride-card">
                <div class="ride-header">
                    <p class="customer-name">From <span id="rec-customer">--</span></p>
                </div>
                
                <div class="ride-route">
                    <p>📍 <strong id="rec-origin">--</strong></p>
                    <p>↓</p>
                    <p>🏁 <strong id="rec-destination">--</strong></p>
                </div>

                <div class="ride-details">
                    <span>📏 <strong id="rec-distance">--</strong></span>
                    <span>⏱️ <strong id="rec-duration">--</strong></span>
                    <span>💰 <strong id="rec-amount">--</strong> €</span>
                </div>
                <div class="ride-actions">
                    <button class="btn btn-accept" onclick="acceptRecommendedRide()">✅ Accept</button>
                    <button class="btn btn-reject" onclick="rejectRecommendedRide()">❌ Reject</button>
                    <button class="btn btn-finish" id="finish-btn" style="display:none;" onclick="finishRide()">🏁 Finish Ride</button>
                </div>

            </div>
        </div>

        <!-- ========== SEÇÃO: VIAGENS POR ACEITAR ========== -->
        <div class="ride-section">
            <h2>📋 Available Rides</h2>
            <div class="rides-container" id="pending-rides-container">
                <!-- Viagens serão inseridas aqui -->
                <p class="empty-message">Loading rides...</p>
            </div>
        </div>
    </div>
</div>

<!-- ========== JAVASCRIPT ========== -->
<script src="{{ url_for('static', filename='js/driver_home.js') }}"></script>


{% endblock %}
