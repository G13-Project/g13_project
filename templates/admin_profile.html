<!DOCTYPE html>
<html>
<head>
    <title>Admin Profile</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_profile.css') }}">
</head>

<body>

<div class="navbar">
    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img">
        Itiji
    </div>

    <div class="nav-right">
        <span class="user">{{ user }}</span>
        <a href="/admin/dashboard">Home</a>
        <a href="/admin/manage_users">Manage Users</a>
        <a href="/admin/top_users">Top Users</a>
        <a href="/admin/stats">Statistics</a>
        <a href="/admin/profile">Profile</a>
        <a href="/logoff">Logout</a>
    </div>
</div>

<div class="home">
<div class="overlay"></div>

<div class="home-content">

<div class="profile-wrapper">

<div class="profile-card">

<div class="profile-img">
    <img src="{{ url_for('static', filename='images/admin.png') }}">
</div>

<div class="profile-info">

<h2>Admin Profile</h2>

<form method="POST" action="/admin/edit_profile">

<p><b>ID:</b> {{ admin.id }}</p>

<p>
<b>Username:</b>
<span id="usernameText">{{ admin.user }}</span>

<input id="usernameInput" name="username"
       value="{{ admin.user }}" style="display:none;">
</p>

<div id="passwordBlock" style="display:none;">
<p>
<b>Password:</b>
<input name="password" type="password" placeholder="New password">
</p>
</div>

<p><b>Permissions:</b> Full access</p>

<div class="profile-actions">

<button type="button" onclick="openAbout()" class="btn-glow">📘 About</button>

<button type="button" onclick="toggleEdit()" class="btn-glow">✏️ Edit</button>

<button id="saveBtn" type="submit" class="btn-glow" style="display:none;">
💾 Save
</button>

</div>

</form>

</div>

</div>

<!-- LOGS -->
<div class="admin-logs-inline">

<h3>Recent Activity</h3>

{% for log in logs %}
<div class="log-item">
<span class="log-time">{{ log.time }}</span>
<span class="log-action">{{ log.action }}</span>
</div>
{% endfor %}

</div>

</div>

</div>
</div>

<!-- MODAL -->
<div id="aboutModal" class="modal">
<div class="modal-content about-big">

<span class="close" onclick="closeAbout()">&times;</span>

<h1>🎥 Project Demo</h1>

<div class="video-grid">

<iframe src="https://www.youtube.com/embed/VIDEO1"></iframe>
<iframe src="https://www.youtube.com/embed/VIDEO2"></iframe>
<iframe src="https://www.youtube.com/embed/VIDEO3"></iframe>

</div>

</div>
</div>

<script src="{{ url_for('static', filename='js/admin_profile.js') }}"></script>

</body>
</html>
