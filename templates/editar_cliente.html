<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Editar Dados</title>
</head>

<body>
    <h2>Editar Dados do Cliente</h2>

    <form method="post">
        <label>Nome:</label>
        <input type="text" name="name" value="{{ cliente.name }}"><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ cliente.email }}"><br>

        <label>Telemóvel:</label>
        <input type="text" name="phone" value="{{ cliente.phone }}"><br>

        <label>Data de nascimento:</label>
        <input type="date" name="dob" value="{{ cliente.dob }}"><br>

        <button type="submit">Guardar</button>
    </form>
</body>
</html>
