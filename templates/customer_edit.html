{% extends 'base.html' %}

{% block content %}
<div class="bg">
    <div class="box profile-page">

        <h1>Edit Profile</h1>

        <form method="POST" enctype="multipart/form-data">

            <label>Name:</label>
            <input type="text" name="name" value="{{ cliente._name }}" required>

            <label>Email:</label>
            <input type="email" name="email" value="{{ cliente._email }}" required>

            <label>Phone Number:</label>
            <input type="text" name="phone" value="{{ cliente._phone }}" required>

            <label>Date of Birth:</label>
            <input type="date" name="dob" value="{{ cliente._dob }}" required>

            <label>Photo:</label>
            <input type="file" name="photo" accept="image/*">

            <button type="submit" class="btn">Save Changes</button>
        </form>

        <a href="{{ url_for('customer_profile') }}" class="btn btn-voltar">Back</a>


    </div>
</div>
{% endblock %}
