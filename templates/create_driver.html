{% extends 'base.html' %}

{% block content %}
<div class="bg">
    <div class="box">

        <h2>Bem-vindo!</h2>
        <p>Por favor insira os seus dados para concluir o registo.</p>

        <form method="post" action="/save_driver">
            <input name="nickname" placeholder="Nickname" required>
        <input name="driver_type" placeholder="Driver Type" required>

            <button class="btn">Create Account</button>
        </form>

    </div>
</div>

{% if resul %}
    <p class="error">{{ resul }}</p>
{% endif %}
{% endblock %}
