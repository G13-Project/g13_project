<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <!-- CSS DA PÁGINA -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_dashboard.css') }}">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img">
        Itiji
    </div>

    <div class="nav-right">
        <span class="user">{{ user }}</span>
        <a href="/admin/dashboard">Home</a>
        <a href="/admin/manage_users">Manage Users</a>
        <a href="/admin/top_users">Top Users</a>
        <a href="/admin/stats">Statistics</a>
        <a href="/admin/profile">Profile</a>
        <a href="/logoff">Logout</a>
    </div>
</div>

<!-- CONTENT -->
<div class="home">
    <div class="overlay"></div>

    <div class="home-content">

        <h1 style="text-align:center;">Totals</h1>

        <div class="container">

            <!-- LINHA 1 -->
            <div class="row">

                <div class="ride-box">
                    <p style="font-size:28px;">🚖</p>
                    <h2>{{ total_rides }}</h2>
                    <p>Rides</p>
                </div>

                <div class="ride-box">
                    <p style="font-size:28px;">🚗</p>
                    <h2>{{ total_cars }}</h2>
                    <p>Cars</p>
                </div>

                <div class="ride-box">
                    <p style="font-size:28px;">📄</p>
                    <h2>{{ total_contracts }}</h2>
                    <p>Contracts</p>
                </div>

                <!-- WARNINGS -->
                <div class="ride-box hover-card warnings-box" onclick="loadWarnings()">
                    <h3>⚠️ Warnings</h3>
                    <p>Click to check warnings</p>
                </div>

            </div>

            <!-- GRÁFICO -->
            <div class="chart-box">

                <h3 style="margin-bottom:20px;">Users Distribution</h3>

                <img 
                    src="data:image/png;base64,{{ plot_url }}"
                    style="max-width:100%; border-radius:10px;"
                >

            </div>

        </div>

    </div>
</div>

<!-- MODAL -->
<div id="warningsModal" class="warnings-modal" style="display:none;">

    <div class="warnings-content">

        <span onclick="closeWarnings()" class="close-btn">✖</span>

        <h2>⚠️ Warnings Report</h2>

        <p id="warningText">Click to load warnings</p>

        <hr>

        <div id="warningsList"></div>

        <hr>

        <div style="margin-top:20px;">
            <a href="/admin/manage_users" class="intervene-btn">
                Intervene
            </a>
        </div>

    </div>
</div>

<!-- JS (NO FINAL!) -->
<script src="{{ url_for('static', filename='js/admin_dashboard.js') }}"></script>

</body>
</html>
