<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Top Users</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

<style>
.container {
    max-width:1100px;
    margin:40px auto;
    text-align:center;
}

/* ✅ FILTER BAR */
.filter-bar {
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

select {
    padding:10px;
    border-radius:8px;
    border:none;
    min-width:180px;
    background:#1e1e1e;
    color:white;
}

button {
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#00bfff;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    background:#0099cc;
}

/* ✅ PODIUM */
.podium {
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:30px;
    margin-top:60px;
}

/* ✅ caixas maiores */
.place {
    background:#2a2a2a;
    padding:20px;
    border-radius:12px;
    width:200px;                /* ✅ AUMENTADO */
    min-height:150px;           /* ✅ garante espaço */
    text-align:center;
    transition:0.3s;
}

/* ✅ texto bem ajustado */
.place h3 {
    font-size:16px;
    margin:10px 0;
    word-break: break-word;     /* ✅ evita overflow */
}

.place p {
    font-size:18px;
    font-weight:bold;
    color:black;
}

/* ✅ cores podium */
.place.gold {
    height:240px;
    background:#ffd700;
    color:black;
}

.place.silver {
    height:200px;
    background:#c0c0c0;
    color:black;
}

.place.bronze {
    height:180px;
    background:#cd7f32;
    color:black;
}

/* ✅ hover */
.place:hover {
    transform:scale(1.05);
}



.place h3,
.place p {
    color: black !important;
}

</style>
</head>

<body>

<!-- ✅ NAVBAR -->
<div class="navbar">
    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img">
        Itiji
    </div>

    <div class="nav-right">
        <span class="user">{{ user }}</span>
        <a href="/admin/dashboard">Home</a>
        <a href="/admin/manage_users">Manage Users</a>
        <a href="/admin/top_users">Top Users</a>
        <a href="/admin/stats">Statistics</a>
        <a href="/admin/profile">Profile</a>
        <a href="/logoff">Logout</a>
    </div>
</div>

<!-- ✅ MAIN COM FUNDO -->
<div class="home">
<div class="overlay"></div>

<div class="home-content">

<div class="container">

<h1>🏆 Top Users</h1>

<!-- ✅ FILTERS -->
<div class="filter-bar">

<select id="groupSelect">
    <option value="">Select group...</option>
    <option value="customers">customers</option>
    <option value="drivers">drivers</option>
    <option value="companies">companies</option>
</select>

<select id="metricSelect">
    <option value="">Select metric...</option>
</select>

<button onclick="confirmSelection()">Show Top 3</button>

</div>

<!-- ✅ PODIUM -->
<div class="podium" id="podium"></div>

<!-- ✅ SCRIPT -->
<script>

const metrics = {
    customers: ["rides", "distance", "amount"],  
    drivers: ["rides", "distance", "amount", "contracts", "rating"],
    companies: ["drivers", "cars", "profit", "contracts", "rating"]
};

/* ✅ preencher métricas */
document.getElementById("groupSelect").addEventListener("change", function () {

    const group = this.value;
    const metricSelect = document.getElementById("metricSelect");

    metricSelect.innerHTML = `<option value="">Select metric...</option>`;

    if (!group) return;

    metrics[group].forEach(m => {
        metricSelect.innerHTML += `<option value="${m}">${m}</option>`;
    });

});

/* ✅ formatação */
function formatValue(metric, value) {

    if(metric === "distance") return value + " km";
    if(metric === "amount" || metric === "profit") return value + " €";
    if(metric === "rating") return value.toFixed(2) + " ⭐";

    return value;
}

/* ✅ botão */
function confirmSelection() {

    const group = document.getElementById("groupSelect").value;
    const metric = document.getElementById("metricSelect").value;
    const podium = document.getElementById("podium");

    if (!group || !metric) {
        podium.innerHTML = "<p>Please select both options</p>";
        return;
    }

    podium.innerHTML = "<p>Loading...</p>";

    fetch(`/admin/get_top/${group}/${metric}`)
        .then(res => res.json())
        .then(data => {

            if (data.length < 3) {
                podium.innerHTML = "<p>No data</p>";
                return;
            }

            podium.innerHTML = `
            <div class="place silver">
                🥈
                <h3>${data[1].name}</h3>
                <p>${data[1].subtitle || ""}</p>
                <p>${formatValue(metric, data[1].value)}</p>
            </div>

            <div class="place gold">
                🥇
                <h3>${data[0].name}</h3>
                <p>${data[0].subtitle || ""}</p>
                <p>${formatValue(metric, data[0].value)}</p>
            </div>

            <div class="place bronze">
                🥉
                <h3>${data[2].name}</h3>
                <p>${data[2].subtitle || ""}</p>
                <p>${formatValue(metric, data[2].value)}</p>
            </div>
            `;
        });
}

</script>


</body>
</html>
